name: Configuration compatibility

on:
  push:
  pull_request:

jobs:
  configuration-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install configuration test dependencies
        run: python -m pip install numpy h5py PyYAML==6.0.3 ruamel.yaml==0.18.0
      - name: Test configuration completion and pipeline loading
        run: python -m unittest discover -s tests -p "test_config*.py" -v
