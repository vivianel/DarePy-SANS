name: DarePy regression tests

on:
  push:
  pull_request:

jobs:
  configuration-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==1.26.4 h5py matplotlib==3.7.2 PyYAML==6.0.3 ruamel.yaml==0.18.0 tabulate==0.9.0
      - name: Test configuration compatibility, metadata exports and detector viewer
        run: python -m unittest discover -s tests -p "test_*.py" -v
